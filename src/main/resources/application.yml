server:
  port: 8089

spring:
  profiles:
    active: active
  application:
    name: xiji

# 自定义配置
custom:
  cors:
    # 允许的源，多个源用逗号分隔
    allowed-origins: http://localhost:3000,https://yourdomain.com
    # 是否允许凭证
    allow-credentials: true
    # 允许的HTTP方法
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    # 允许的请求头
    allowed-headers: "*"
    # 暴露的响应头
    exposed-headers: "*"