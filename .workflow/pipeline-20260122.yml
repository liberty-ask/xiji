version: '1.0'
name: pipeline-20260122
displayName: pipeline-20260122
triggers:
  trigger: auto
  pr:
    branches:
      precise:
        - master
stages:
  - name: stage-13b730d5
    displayName: 编译
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@maven
        name: build_maven
        displayName: Maven 构建
        jdkVersion: '21'
        mavenVersion: 3.6.3
        commands:
          - '# 功能：打包'
          - '# 参数说明：'
          - '#    -Dmaven.test.skip=true：跳过单元测试'
          - '#    -U：每次构建检查依赖更新，可避免缓存中快照版本依赖不更新问题，但会牺牲部分性能'
          - '#    -e -X ：打印调试信息，定位疑难构建问题时建议使用此参数构建'
          - '#    -B：以batch模式运行，可避免日志打印时出现ArrayIndexOutOfBoundsException异常'
          - '# 使用场景：打包项目且不需要执行单元测试时使用'
          - mvn clean package -Dmaven.test.skip=true -U -e -X -B
          - ''
          - '# 功能：自定义settings配置'
          - '# 使用场景：如需手工指定settings.xml，可使用如下方式'
          - '# 注意事项：如无需自定义settings配置且需要私有依赖仓库，可在该任务配置《私有仓库》处添加私有依赖'
          - '# mvn -U clean package -s ./settings.xml'
          - ''
        artifacts:
          - name: xiji
            path:
              - target/*.jar
        settings: []
        caches:
          - ~/.m2
        notify: []
        strategy:
          retry: '0'
          expression: []
  - name: stage-fe622155
    displayName: 上传制品
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: publish@general_artifacts
        name: publish_general_artifacts
        displayName: 上传制品
        dependArtifact: xiji
        artifactName: xiji
        notify: []
        strategy:
          retry: '0'
  - name: stage-201e0862
    displayName: 发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: publish@release_artifacts
        name: publish_release_artifacts
        displayName: 发布
        dependArtifact: xiji
        version: 1.0.0.0
        autoIncrement: true
        notify: []
        strategy:
          retry: '0'
  - name: stage-c993daa0
    displayName: 部署
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: deploy@agent
        name: deploy_agent
        displayName: 主机部署
        hostGroupID:
          ID: '1'
          hostID:
            - bc28f5ae-28d1-4132-a3e3-ba67850e8f61
        deployArtifact:
          - source: artifact
            name: xiji
            target: ~/gitee_go/deploy
            artifactRepository: release
            artifactName: xiji
            artifactVersion: latest
        script:
          - '# === 部署脚本：自动备份旧包、解压新包、启动服务 ==='
          - mkdir -p /www/wwwroot/jar
          - mkdir -p /www/wwwroot/jar/bak/xiji  # 创建备份目录
          - cd /www/wwwroot/jar
          - |
            if pgrep -f "xiji-1.0.0.jar" > /dev/null; then
              echo "🛑 正在停止旧服务..."
              pkill -f "xiji-1.0.0.jar"
              sleep 3
              if pgrep -f "xiji-1.0.0.jar" > /dev/null; then
                echo "⚠️ 强制终止旧进程..."
                pkill -9 -f "xiji-1.0.0.jar"
                sleep 2
              fi
            else
              echo "✅ 未检测到运行中的 xiji.jar 服务"
            fi
          - '# 🔍 检查是否存在旧的 xiji.jar 文件，用于备份'
          - |
            if [ -f "/www/wwwroot/jar/xiji-1.0.0.jar" ]; then
              echo "📦 发现旧版 JAR 文件，正在备份..."
              # 生成时间戳：YYYYMMDD_HHMMSS
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              # 生成两位随机数
              RANDOM_NUM=$(printf "%02d" $((RANDOM % 100)))
              # 构建备份文件名
              BACKUP_NAME="xiji_${TIMESTAMP}_${RANDOM_NUM}.tar.gz"
              # 创建备份目录（确保存在）
              mkdir -p /www/wwwroot/jar/bak/xiji
              # 压缩备份
              tar -czf "/www/wwwroot/jar/bak/xiji/${BACKUP_NAME}" xiji-1.0.0.jar
              echo "✅ 已备份旧包为: ${BACKUP_NAME}"
            else
              echo "ℹ️ 无旧版 JAR 文件，跳过备份"
            fi
          - '# 🔍 查看压缩包内容'
          - tar -tzf ~/gitee_go/deploy/xiji.tar.gz
          - '# 📦 解压新制品包'
          - tar zxvf ~/gitee_go/deploy/xiji.tar.gz -C /www/wwwroot/jar --strip-components=1
          - '# 🔍 查看解压后内容'
          - ls -la /www/wwwroot/jar/
          - '# 🚀 自动查找并启动第一个 JAR 文件'
          - |
            JAR_FILE=$(find /www/wwwroot/jar -name "xiji-1.0.0.jar" | head -n 1)
            if [ -z "$JAR_FILE" ]; then
              echo "❌ 未找到任何 JAR 文件！请检查构建产物。"
              exit 1
            fi
            echo "📦 找到 JAR 文件: $JAR_FILE"
            echo "🚀 正在启动服务..."
            /www/server/java/jdk-21.0.2/bin/java \
              -jar \
              -Xmx1024M \
              -Xms256M \
              "$JAR_FILE" \
              > /www/wwwroot/jar/start.log 2>&1 &
          - |
            sleep 5
            if pgrep -f "xiji-1.0.0.jar" > /dev/null; then
              echo "✅ 服务启动成功！PID: $(pgrep -f xiji-1.0.0.jar)"
              echo "📅 启动时间: $(date)" >> /www/wwwroot/jar/start.log
            else
              echo "❌ 服务启动失败！请查看日志：/www/wwwroot/jar/start.log"
              exit 1
            fi
          - rm -f ~/gitee_go/deploy/xiji.tar.gz
          - echo "🎉 部署完成！"
        notify: []
        strategy:
          retry: '0'
